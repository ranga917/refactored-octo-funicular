<!DOCTYPE html>
<html>
<head>
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karnataka Tourism | Explore Tourist Places</title>

    <meta name="description" content="Explore Karnataka's beautiful tourist places, waterfalls, temples, beaches and historical destinations.">

    <meta name="keywords" content="Karnataka Tourism, Karnataka Tourist Places, Hassan Tourism, Mysore Tourism">

    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to Karnataka Tourism</h1>

    <h2>Login</h2>

    <form onsubmit="login(event)">

        <input type="text"
               id="username"
               placeholder="Enter Username"
               required>

        <br><br>

        <input type="password"
               id="password"
               placeholder="Enter Password"
               required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

    <footer>
        <p>Created by Rangaswamy HL</p>
        <p>Karnataka Tourism Website - 2026</p>
    </footer>

    <script>
        function login(event) {

            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            sessionStorage.setItem("username", username);

            window.location.href = "districts.html";
        }
    </script>

</body>
</html>
